name: Refresh listings

on:
  schedule:
    - cron: "17 11 * * *" # daily ~6:17am ET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch listings
        env:
          FLIPPA_API_KEY: ${{ secrets.FLIPPA_API_KEY }}
        run: node pipeline/fetch.mjs
      - name: Commit if changed
        run: |
          git config user.name "acquirescreen-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/listings.json
          git diff --cached --quiet || git commit -m "chore: refresh listings"
          git push
